{% extends 'base.html' %}
{% block content %}
  <h1>Events</h1>
  <ul class="list-group">
  {% for e in events %}
    <li class="list-group-item">
      <a href="{{ url_for('event_view', event_id=e.id) }}">{{ e.title }}</a>
      <span class="float-end">{{ e.date }}</span>
    </li>
  {% else %}
    <li class="list-group-item">No events.</li>
  {% endfor %}
  </ul>
{% endblock %}
