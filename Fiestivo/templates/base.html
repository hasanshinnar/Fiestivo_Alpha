<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiestivo – Find Your People</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    {% block pageCSS %}
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <head>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      />

      <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style/base.css') }}"
      />
    </head>
    {% endblock %}
  </head>
  <body>
    {% block nav %}
    <nav>
      <div class="nav-inner">
        <a class="logo" href="/">Fiesti<span>vo</span></a>
        <div class="search-wrap">
          <input type="text" placeholder="Search events near you…" />
          <button><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-links">
          <a href="/" class="active"
            ><i class="fas fa-home"></i> <span class="nav-text">Home</span></a
          >
          <a href="/categories"
            ><i class="fas fa-compass"></i>
            <span class="nav-text">Browse</span></a
          >
          <a href="{{ url_for('create_event') }}" class="btn-create"
            ><i class="fas fa-plus"></i>
            <span class="nav-text">Create Event</span></a
          >
          <a href="/login"
            ><i class="fas fa-user"></i> <span class="nav-text">Login</span></a
          >
        </div>
      </div>
    </nav>
    {% endblock %} {% block footer %}
    <footer>
      <span class="f-logo">Fiesti<span>vo</span></span>
      <div class="f-links">
        <a href="{{ url_for('home_page') }}">Home</a>
        <a href="{{ url_for('create_event') }}">Create Event</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="/categories">Browse Events</a>
        <a href="/about">About</a>
      </div>
      <p>© 2025 Fiestivo. All rights reserved.</p>
    </footer>
    {% endblock %}
  </body>
</html>
